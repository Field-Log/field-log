detections:
  - id: "webLogProxy"
    source: "@app/web"
    target: "@app/api"
    label: "source scan: VITE_API_URL -> /api/v0/logs"
    paths:
      - "apps/web/src/lib/logger.ts"
    patterns:
      - "/api/v0/logs"
      - "VITE_API_URL"
  - id: "mobileLogProxy"
    source: "@app/mobile"
    target: "@app/api"
    label: "source scan: EXPO_PUBLIC_API_URL -> /api/v0/logs"
    paths:
      - "apps/mobile/src/lib/logger.ts"
    patterns:
      - "/api/v0/logs"
      - "EXPO_PUBLIC_API_URL"
  - id: "mobileVersionPolicy"
    source: "@app/mobile"
    target: "@app/api"
    label: "source scan: EXPO_PUBLIC_API_URL -> /api/v0/mobile-version"
    paths:
      - "apps/mobile/src/lib/mobile-version-policy.ts"
    patterns:
      - "/api/v0/mobile-version"
      - "EXPO_PUBLIC_API_URL"
  - id: "webClerk"
    source: "@app/web"
    target: "clerk"
    label: "source scan: Clerk web SDK"
    paths:
      - "apps/web/src"
    patterns:
      - "@clerk/tanstack-react-start"
  - id: "mobileClerk"
    source: "@app/mobile"
    target: "clerk"
    label: "source scan: Clerk Expo SDK"
    paths:
      - "apps/mobile"
    patterns:
      - "@clerk/expo"
  - id: "mobileFirebase"
    source: "@app/mobile"
    target: "firebase"
    label: "source scan: Firebase / Firestore"
    paths:
      - "apps/mobile/src"
    patterns:
      - "firebase/"
      - "getFirestore"
  - id: "webAxiom"
    source: "@app/web"
    target: "axiom"
    label: "source scan: createAxiomTransport"
    paths:
      - "apps/web"
    patterns:
      - "createAxiomTransport"
      - "AXIOM_TOKEN"
  - id: "apiAxiom"
    source: "@app/api"
    target: "axiom"
    label: "source scan: createAxiomTransport"
    paths:
      - "apps/api/src"
    patterns:
      - "createAxiomTransport"
      - "AXIOM_TOKEN"
