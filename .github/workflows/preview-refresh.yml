name: Preview Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    name: Refresh Preview
    runs-on: ubuntu-latest
    env:
      AXIOM_DATASET: ${{ secrets.AXIOM_DATASET_PREVIEW }}
      AXIOM_EDGE_DOMAIN: ${{ secrets.AXIOM_EDGE_DOMAIN }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN_PREVIEW }}
      CI_JOB_NAME: Refresh Preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset preview from production
        id: preview_db
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
          NEON_DATABASE_USER: ${{ secrets.NEON_DATABASE_USER }}
        run: bash .github/scripts/neon-database-branch.sh refresh-preview

      - name: Run preview migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ steps.preview_db.outputs.database_url }}
        run: |
          set -euo pipefail

          set +e
          pnpm exec drizzle-kit migrate --config=drizzle.config.ts
          migration_status=$?
          set -e

          source ../../.github/scripts/ci-log.sh
          if [[ "$migration_status" -ne 0 ]]; then
            emit_ci_log error "ci.database.preview.migrations.failed" "$(jq -n \
              --arg branch_name "${{ steps.preview_db.outputs.branch_name }}" \
              --arg branch_id "${{ steps.preview_db.outputs.branch_id }}" \
              --arg failure_step "drizzle-kit migrate" \
              '{
                branchName: $branch_name,
                branchId: $branch_id,
                failureStep: $failure_step
              }')"
            exit "$migration_status"
          fi

          emit_ci_log info "ci.database.preview.migrations.applied" "$(jq -n \
            --arg branch_name "${{ steps.preview_db.outputs.branch_name }}" \
            --arg branch_id "${{ steps.preview_db.outputs.branch_id }}" \
            '{
              branchName: $branch_name,
              branchId: $branch_id
            }')"

      - name: Build Worker dependencies
        run: pnpm exec turbo run build --filter=@app/api

      - name: Validate Infisical OIDC configuration
        shell: bash
        env:
          INFISICAL_CLOUDFLARE_IDENTITY_ID: ${{ secrets.INFISICAL_CLOUDFLARE_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ secrets.INFISICAL_PROJECT_SLUG }}
        run: |
          set -euo pipefail

          if [[ -z "${INFISICAL_CLOUDFLARE_IDENTITY_ID:-}" ]]; then
            echo "GitHub secret INFISICAL_CLOUDFLARE_IDENTITY_ID is required." >&2
            exit 1
          fi

          if [[ -z "${INFISICAL_PROJECT_SLUG:-}" ]]; then
            echo "GitHub secret INFISICAL_PROJECT_SLUG is required." >&2
            exit 1
          fi

      - name: Fetch Cloudflare deploy secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_CLOUDFLARE_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: /tools/cloudflare

      - name: Fetch API runtime secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_CLOUDFLARE_IDENTITY_ID }}
          oidc-audience: ${{ secrets.INFISICAL_OIDC_AUDIENCE || format('https://github.com/{0}', github.repository_owner) }}
          domain: ${{ secrets.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          secret-path: /apps/api

      - name: Write preview API secrets file
        shell: bash
        env:
          PREVIEW_DATABASE_URL: ${{ steps.preview_db.outputs.database_url }}
        run: |
          set -euo pipefail

          for name in CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required in Infisical /apps/api." >&2
              exit 1
            fi
          done

          jq -n \
            --arg DATABASE_URL "$PREVIEW_DATABASE_URL" \
            --arg CLERK_PUBLISHABLE_KEY "${CLERK_PUBLISHABLE_KEY:-}" \
            --arg CLERK_SECRET_KEY "${CLERK_SECRET_KEY:-}" \
            --arg AXIOM_TOKEN "${AXIOM_TOKEN:-}" \
            --arg AXIOM_DATASET "${AXIOM_DATASET:-}" \
            --arg AXIOM_EDGE_DOMAIN "${AXIOM_EDGE_DOMAIN:-}" \
            --arg LOG_LEVEL "${LOG_LEVEL:-}" \
            --arg LOG_DEPLOYMENT_ID "${LOG_DEPLOYMENT_ID:-preview}" \
            --arg LOG_DEPLOYMENT_TARGET "${LOG_DEPLOYMENT_TARGET:-cloudflare-worker}" \
            --arg LOGGER "${LOGGER:-}" \
            --arg LOG_PROXY_CLIENT_KEY "${LOG_PROXY_CLIENT_KEY:-}" \
            --arg MOBILE_ANDROID_STORE_URL "${MOBILE_ANDROID_STORE_URL:-}" \
            --arg MOBILE_IOS_STORE_URL "${MOBILE_IOS_STORE_URL:-}" \
            --arg MOBILE_LATEST_VERSION "${MOBILE_LATEST_VERSION:-}" \
            --arg MOBILE_MIN_SUPPORTED_VERSION "${MOBILE_MIN_SUPPORTED_VERSION:-}" \
            --arg MOBILE_UPDATE_SEVERITY "${MOBILE_UPDATE_SEVERITY:-}" \
            '{
              DATABASE_URL: $DATABASE_URL,
              CLERK_PUBLISHABLE_KEY: $CLERK_PUBLISHABLE_KEY,
              CLERK_SECRET_KEY: $CLERK_SECRET_KEY,
              AXIOM_TOKEN: $AXIOM_TOKEN,
              AXIOM_DATASET: $AXIOM_DATASET,
              AXIOM_EDGE_DOMAIN: $AXIOM_EDGE_DOMAIN,
              LOG_LEVEL: $LOG_LEVEL,
              LOG_DEPLOYMENT_ID: $LOG_DEPLOYMENT_ID,
              LOG_DEPLOYMENT_TARGET: $LOG_DEPLOYMENT_TARGET,
              LOGGER: $LOGGER,
              LOG_PROXY_CLIENT_KEY: $LOG_PROXY_CLIENT_KEY,
              MOBILE_ANDROID_STORE_URL: $MOBILE_ANDROID_STORE_URL,
              MOBILE_IOS_STORE_URL: $MOBILE_IOS_STORE_URL,
              MOBILE_LATEST_VERSION: $MOBILE_LATEST_VERSION,
              MOBILE_MIN_SUPPORTED_VERSION: $MOBILE_MIN_SUPPORTED_VERSION,
              MOBILE_UPDATE_SEVERITY: $MOBILE_UPDATE_SEVERITY
            } | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/api-preview-refresh-secrets.json"

      - name: Deploy and smoke test preview Worker
        working-directory: apps/api
        run: |
          set -euo pipefail

          set +e
          deploy_output="$(bash scripts/deploy-preview.sh \
            --preview-alias refresh-smoke \
            --secrets-file "$RUNNER_TEMP/api-preview-refresh-secrets.json" 2>&1)"
          deploy_status=$?
          set -e

          printf '%s\n' "$deploy_output"

          if [[ "$deploy_status" -ne 0 ]]; then
            exit "$deploy_status"
          fi

          if [[ "$deploy_output" =~ Version[[:space:]]Preview[[:space:]]Alias[[:space:]]URL:[[:space:]](https://[^[:space:]]+) ]]; then
            preview_url="${BASH_REMATCH[1]}"
          else
            echo "Wrangler did not print a Version Preview Alias URL for refresh-smoke." >&2
            exit 1
          fi

          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$preview_url/api/v0/health"
